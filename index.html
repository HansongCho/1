<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hansong Cho Office</title>
  <!-- Google Fonts: DM Mono -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 20px; /* 화면 테두리와 약간 띄움 */
      font-family: 'DM Mono', monospace;
      background-color: #ffffff;
    }

    .container {
      text-align: left; /* 왼쪽 정렬 */
      line-height: 1.5; /* 줄 간격 */
    }

    .container h1,
    .container p {
      font-size: 18px; /* 모든 글씨 같은 크기 */
      font-weight: 400;
      margin: 4px 0; /* 위아래 여백 최소화 */
    }

    a {
      color: #555;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hansong Cho Office</h1>
    <p>Architecture and Design</p>
    <p><a href="mailto:office@hansongcho.com">office@hansongcho.com</a></p>
  </div>
</body>
</html>
