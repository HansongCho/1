<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hansong Cho Office</title>
  <!-- Google Fonts: DM Mono -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: 'DM Mono', monospace;
    }
    .container {
      text-align: center;
      padding: 0 20px;
    }
    h1 {
      font-size: 36px;
      font-weight: 400;
      margin: 0 0 12px 0;
      letter-spacing: 0.08em;
    }
    p {
      font-size: 20px;
      color: #555;
      margin: 0 0 12px 0;
    }
    a {
      color: #555;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
      }
      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hansong Cho Office</h1>
    <p>Architecture and Design</p>
    <p><a href="mailto:office@hansongcho.com">office@hansongcho.com</a></p>
  </div>
</body>
</html>
